# 提交后验证：Linux / macOS 的 Debug + Release 矩阵，以及 Windows 的 Debug + Release。
# 只构建、跑全量自检并留存 artifacts，不发布产物；发布见 release.yml。
name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    name: Unix (${{ matrix.os }}, ${{ matrix.config }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-5compat-dev libsdl2-dev libarchive-dev zlib1g-dev ffmpeg nasm yasm
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install nasm yasm ffmpeg
          python -m pip install aqtinstall
          python -m aqt install-qt mac desktop 6.8.3 clang_64 -m qt5compat -O "$RUNNER_TEMP/Qt"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.8.3/macos;$RUNNER_TEMP/SDL" >> "$GITHUB_ENV"
          curl --fail --location https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz -o "$RUNNER_TEMP/sdl.tar.gz"
          tar -xf "$RUNNER_TEMP/sdl.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL2-2.32.10" -B "$RUNNER_TEMP/sdl-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL"
          cmake --build "$RUNNER_TEMP/sdl-build" -j 4
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: FFmpeg (frozen 9.0)
        shell: bash
        run: |
          echo "frozen FFmpeg source: $(cat 3rd/ffmpeg/RELEASE) @ $(git -C 3rd/ffmpeg rev-parse --short HEAD)"
          ffmpeg -version | head -1
          if [[ "$RUNNER_OS" == macOS ]]; then zsh scripts/build_ffmpeg.sh; else bash scripts/build_ffmpeg_linux.sh; fi
      - name: Build (${{ matrix.config }})
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build-ci -j 4
      - name: Lint (whole src tree)
        if: runner.os == 'Linux' && matrix.config == 'Debug'
        run: |
          python -m pip install --quiet clang-format==18.1.8 clang-tidy==18.1.8
          # 整仓口径：src/ 下任何一行不合规都挂，不靠“只查改动行”给历史债留口子。
          python scripts/lint.py all --all --build-dir build-ci
      - name: Full selftest
        env:
          TTPLAYER_BIN: build-ci/ttplayer
          TTPLAYER_PROBE: build-ci/selftest
        run: python scripts/selftest.py all
      - name: CTest
        run: ctest --test-dir build-ci --output-on-failure
      - name: Prepare distributable (Release)
        if: matrix.config == 'Release'
        run: python scripts/package.py
      - name: Upload Unix artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.os }}-${{ matrix.config }}-validation
          path: |
            build-ci/selftest
            build/dist
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make nasm yasm
          path-type: inherit
      - name: Windows dependencies
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qt5compat -O "$env:RUNNER_TEMP/Qt"
          vcpkg install sdl2:x64-windows libarchive:x64-windows zlib:x64-windows
          echo "TTPLAYER_VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          echo "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH
          echo "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          choco install ffmpeg -y --no-progress
      - name: FFmpeg (frozen 9.0, MSVC ABI)
        shell: msys2 {0}
        run: |
          echo "frozen FFmpeg source: $(cat 3rd/ffmpeg/RELEASE) @ $(git -C 3rd/ffmpeg rev-parse --short HEAD)"
          ffmpeg -version | head -1
          bash scripts/build_ffmpeg_msvc.sh
      - name: Build, selftest and package (Debug + Release)
        shell: pwsh
        run: |
          # 同一个 build-ci 目录分别构建 Debug / Release，各自跑全量自检与 CTest；
          # 最后只把 Release 安装成 build/dist 供 artifact 留存。
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64
          foreach ($config in @("Debug", "Release")) {
            cmake --build build-ci --config $config -j 4
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:TTPLAYER_BIN="build-ci/$config/ttplayer.exe"
            $env:TTPLAYER_PROBE="build-ci/selftest-$config"
            python scripts/selftest.py all
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            ctest --test-dir build-ci -C $config --output-on-failure
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python scripts/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-windows-validation
          path: |
            build-ci/selftest-*
            build/dist
