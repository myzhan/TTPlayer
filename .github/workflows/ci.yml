# 提交后验证：Linux / macOS 的 Debug + Release 矩阵，以及共享 FFmpeg 产物的 Windows 双构型矩阵。
# 只构建、跑全量自检并留存 artifacts，不发布产物；发布见 release.yml。
name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linter:
    name: Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-5compat-dev nasm yasm pkg-config
          python -m pip install --quiet aqtinstall clang-format==18.1.8 clang-tidy==18.1.8
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qt5compat -O "$RUNNER_TEMP/Qt"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.8.3/gcc_64" >> "$GITHUB_ENV"
      - name: FFmpeg (frozen 9.0)
        run: |
          echo "frozen FFmpeg source: $(cat 3rd/ffmpeg/RELEASE) @ $(git -C 3rd/ffmpeg rev-parse --short HEAD)"
          bash scripts/build_ffmpeg_linux.sh
      - name: Configure and generate moc headers
        run: |
          cmake -S . -B build/lint-ci -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/lint-ci --target ttplayer_autogen -j 4
      - name: Lint (whole src tree)
        # 不设 continue-on-error；脚本非零退出会使本 job 和整个 CI 失败。
        run: python scripts/lint.py all --all --build-dir build/lint-ci
      - name: Upload linter diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-linter-diagnostics
          path: build/lint-ci/lint
  unix:
    name: Unix (${{ matrix.os }}, ${{ matrix.config }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # 系统 Qt 只用来提供 GL/xkb/dbus 等依赖库；实际链接下一步装的 6.8.3。
          # SDL3 / libarchive / liblzma 由 3rd/ 下 submodule 现编；zlib1g-dev 只给
          # scripts/build_ffmpeg_linux.sh 的 --enable-zlib 探测用，最终链接仍用 vendored zlib。
          sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-5compat-dev zlib1g-dev ffmpeg nasm yasm pkg-config
      - name: Linux Qt 6.8.3
        if: runner.os == 'Linux'
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qt5compat -O "$RUNNER_TEMP/Qt"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.8.3/gcc_64" >> "$GITHUB_ENV"
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install nasm yasm ffmpeg pkg-config
          python -m pip install aqtinstall
          python -m aqt install-qt mac desktop 6.8.3 clang_64 -m qt5compat -O "$RUNNER_TEMP/Qt"
          # 环境变量在 Unix 上以冒号分隔；SDL3 走 3rd/sdl3 子模块，不再现编安装。
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.8.3/macos" >> "$GITHUB_ENV"
      - name: FFmpeg (frozen 9.0)
        shell: bash
        run: |
          echo "frozen FFmpeg source: $(cat 3rd/ffmpeg/RELEASE) @ $(git -C 3rd/ffmpeg rev-parse --short HEAD)"
          ffmpeg -version | head -1
          if [[ "$RUNNER_OS" == macOS ]]; then zsh scripts/build_ffmpeg.sh; else bash scripts/build_ffmpeg_linux.sh; fi
      - name: Build (${{ matrix.config }})
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build/ci -j 4
      - name: Full selftest
        env:
          TTPLAYER_BIN: build/ci/ttplayer
          TTPLAYER_PROBE: build/ci/selftest
        run: python scripts/selftest.py all
      - name: CTest
        run: ctest --test-dir build/ci --output-on-failure
      - name: Prepare distributable (Release)
        if: matrix.config == 'Release'
        run: python scripts/package.py
      - name: Upload Unix artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.os }}-${{ matrix.config }}-validation
          path: |
            build/ci/selftest
            build/dist
  windows-ffmpeg:
    name: Windows FFmpeg (MSVC x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make nasm yasm pkgconf
          path-type: inherit
      - name: FFmpeg (frozen 9.0, MSVC ABI)
        shell: msys2 {0}
        run: |
          echo "frozen FFmpeg source: $(cat 3rd/ffmpeg/RELEASE) @ $(git -C 3rd/ffmpeg rev-parse --short HEAD)"
          # 默认编齐 Release /MD 与 Debug /MDd，外部编码库也各一套。
          bash scripts/build_ffmpeg_msvc.sh
      - name: Upload shared Windows dependencies
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-msvc-dependencies
          if-no-files-found: error
          retention-days: 7
          # 公共根目录是 3rd/；只交接安装产物，不传 .obj-*、CMakeCache 或绝对路径构建树。
          path: |
            3rd/ffmpeg-build/include
            3rd/ffmpeg-build/lib
            3rd/ffmpeg-build/debug/include
            3rd/ffmpeg-build/debug/lib
            3rd/codec-build/include
            3rd/codec-build/lib
            3rd/codec-build/debug/include
            3rd/codec-build/debug/lib
      - name: Upload Windows FFmpeg diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-windows-ffmpeg-diagnostics
          include-hidden-files: true
          path: |
            3rd/ffmpeg-build/.obj-msvc/ffbuild/config.log
            3rd/ffmpeg-build/debug/.obj-msvc/ffbuild/config.log

  windows:
    name: Windows x64 (${{ matrix.config }})
    needs: windows-ffmpeg
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Download shared Windows dependencies
        uses: actions/download-artifact@v4
        with:
          name: ci-windows-msvc-dependencies
          # 恢复到相同目录；两档各在独立 runner，不共享可写构建树。
          path: 3rd
      - name: Verify shared Windows dependencies
        shell: pwsh
        run: |
          # CMake configure 会查两套库的公共 Release 根，即使本 job 只构建 Debug。
          foreach ($suffix in @("", "/debug")) {
            foreach ($library in @("avformat", "avcodec", "swresample", "avutil")) {
              $path = "3rd/ffmpeg-build$suffix/lib/$library.lib"
              if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "缺少共享 FFmpeg 库: $path" }
            }
            foreach ($library in @("vorbisenc", "vorbis", "ogg", "opus", "mp3lame")) {
              $path = "3rd/codec-build$suffix/lib/$library.lib"
              if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "缺少共享编码库: $path" }
            }
            $path = "3rd/ffmpeg-build$suffix/include/libavcodec/avcodec.h"
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "缺少共享 FFmpeg 头文件: $path" }
          }
      - name: Windows dependencies
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qt5compat -O "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # SDL3 / libarchive / zlib / liblzma 全部由 3rd/ 子模块静态现编，不再装 vcpkg 包。
          echo "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" >> $env:GITHUB_ENV
          echo "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ffmpeg -version | Select-Object -First 1
      - name: Build, selftest and CTest (${{ matrix.config }})
        shell: pwsh
        run: |
          # 每个 runner 只构建一档，共享的 FFmpeg 不再编译。
          $config = "${{ matrix.config }}"
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($config -eq "Debug") {
            $debugCrt = Join-Path $env:VCToolsRedistDir "debug_nonredist/x64/Microsoft.VC143.DebugCRT"
            $env:PATH = "$debugCrt;$env:WindowsSdkVerBinPath/x64;$env:PATH"
          }
          cmake --build build/ci --config $config -j 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TTPLAYER_BIN="build/ci/$config/ttplayer.exe"
          $env:TTPLAYER_PROBE="build/ci/selftest-$config"
          $env:QT_QPA_PLATFORM="offscreen"
          $env:TTPLAYER_SILENT_OUTPUT="1"
          $env:TTPLAYER_QT_STATE="$env:RUNNER_TEMP/ci-version-$config/state.json"
          & $env:TTPLAYER_BIN --version
          if ($LASTEXITCODE) {
            $startupExit = $LASTEXITCODE
            dumpbin /DEPENDENTS $env:TTPLAYER_BIN
            exit $startupExit
          }
          python scripts/selftest.py all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/ci -C $config --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare distributable (Release)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          # 直接部署刚通过自检的 Release，不另起 build/package 重编一遍。
          cmake --install build/ci --config Release --prefix build/dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package.py --verify-windows build/dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-windows-${{ matrix.config }}-validation
          include-hidden-files: true
          path: |
            build/ci/selftest-*
            build/dist
